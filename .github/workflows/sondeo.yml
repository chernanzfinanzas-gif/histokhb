name: sondeo
on:
  push:
    branches: [sondeo]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in 'codigo=ZZSONDEO1' ''; do R=$(curl -s -m 30 -H 'Cache-Control: no-cache' -w ' HTTP%{http_code} %{content_type}' "https://historiatotal.es/api/clasificacion.php?$q" | head -c 500 | tr '\n' ' '); echo "::warning::[$q] $R"; done
          H=$(curl -s -m 30 -D - -o /dev/null 'https://historiatotal.es/api/clasificacion.php?codigo=ZZ' | tr '\r\n' '  ' | head -c 600); echo "::warning::CAB $H"
