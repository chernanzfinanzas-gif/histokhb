name: sondeo
on:
  push:
    branches: [sondeo]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1; echo ok
      - run: |
          cat > p.js << 'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const c=await b.newContext({viewport:{width:390,height:844}});
          await c.addInitScript(()=>{localStorage.setItem('hk_anuncio_viaje1','true');localStorage.setItem('hk_viaje_visto','true');localStorage.setItem('hk_codigo','ZZSONDEO1');localStorage.setItem('hk_apodo','"Sondeo"');localStorage.setItem('hk_solo','true');
           localStorage.setItem('hk_reto',JSON.stringify({d:{},w:{n:{},g:{},p:{'2026-11-01':4}}}));localStorage.setItem('hk_nivel','"p"');});
          const p=await c.newPage();const err=[];p.on('pageerror',e=>err.push(e.message));p.on('console',m=>{if(m.type()==='error')err.push('C:'+m.text());});p.on('requestfailed',r=>err.push('F:'+r.url().slice(0,80)+' '+(r.failure()||{}).errorText));p.on('response',r=>{if(r.status()>=400)err.push('S'+r.status()+':'+r.url().slice(0,80));});
          p.on('response',r=>{if(r.url().includes('clasificacion'))r.text().then(t=>console.log('::warning::RESP '+r.status()+' '+t.slice(0,300)));});
          await p.goto('https://historiatotal.es/#/reto');await p.waitForTimeout(6000);
          await p.evaluate(()=>{localStorage.setItem('hk_solo','false');});await p.evaluate(()=>viajeUI());await p.waitForTimeout(4000);
          const v=await p.evaluate(()=>({h:location.hash,on:(document.querySelector('.scr.on')||{}).id,vb:(document.querySelector('#viajeBox')||{textContent:'NO viajeBox'}).textContent.slice(0,250),cl:(document.querySelector('#vClas')||{textContent:'NO vClas'}).textContent.slice(0,150),idx:(typeof IDX!=='undefined'&&IDX)?Object.keys(IDX.fichas).length:'no',lv:typeof LV!=='undefined'?LV:'?'}));const v2=JSON.stringify(v);
          console.log('::warning::VCLAS '+v2+' ERR '+err.join(' | ').slice(0,300));await b.close();})();
          JS
          node p.js
