# Copia la app al hosting de Dinahosting (historiatotal.es) cada vez que se publica algo en main.
name: Publicar en historiatotal.es

on:
  push:
    branches: [main]
  # El buzón de audios y vídeos (rama buzon-medios) se procesa en cada publicación;
  # herramientas/medios.py pide una publicación (workflow_dispatch) al subir al buzón.
  workflow_dispatch:

concurrency:
  group: publicar-hosting
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Recoger los audios y vídeos nuevos del buzón (rama buzon-medios)
        run: python3 herramientas/medios.py recoger

      - name: Enlazar el diccionario con las palabras de las fichas (datos/dic/)
        run: |
          pip install --quiet simplemma || true
          python3 herramientas/diccionario.py || echo "::warning::No se pudo regenerar el diccionario; se publica el que hay"

      - name: Rellenar «Esta semana, hace un tiempo» (datos/semana.json)
        run: python3 herramientas/semana.py || echo "::warning::No se pudo regenerar datos/semana.json; se publica el que hay"

      - name: Novedades automáticas (contenido nuevo o ampliado y líneas «NOVEDAD:» de los commits) y lista de medios
        env:
          NOVEDADES_COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          git config user.name "HistoKHB (publicación automática)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Si otra publicación ha movido main entretanto, se rehace sobre el main nuevo (hasta 4 intentos).
          for intento in 1 2 3 4; do
            python3 herramientas/novedades.py || echo "::warning::No se pudieron generar las novedades"
            git add datos/novedades.json herramientas/novedades_huellas.json datos/medios.json
            git diff --cached --quiet && break
            git commit -q -m "Publicación automática: novedades y lista de medios"
            git push -q origin HEAD:main && break
            echo "main ha cambiado: se repite sobre el main nuevo (intento $intento)"
            sleep $((intento * 5))
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
            python3 herramientas/medios.py recoger
          done

      - name: Preparar la clave SSH
        env:
          KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Falta el secreto HOSTING_SSH_KEY en GitHub (Settings > Secrets > Actions)"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H hl1708.dinaserver.com >> ~/.ssh/known_hosts

      - name: Generar api/config.php (base de datos) si hay secretos configurados
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USUARIO: ${{ secrets.DB_USUARIO }}
          DB_CONTRASENA: ${{ secrets.DB_CONTRASENA }}
          DB_NOMBRE: ${{ secrets.DB_NOMBRE }}
        run: |
          if [ -z "$DB_HOST" ]; then
            echo "::warning::Faltan los secretos DB_HOST/DB_USUARIO/DB_CONTRASENA/DB_NOMBRE en GitHub. El panel de código funcionará en el navegador, pero sin guardar nada en el servidor hasta que se añadan."
          else
            esc() { printf '%s' "$1" | sed "s/'/\\\\'/g"; }
            {
              echo "<?php"
              echo "return ["
              echo "    'host' => '$(esc "$DB_HOST")',"
              echo "    'usuario' => '$(esc "$DB_USUARIO")',"
              echo "    'contrasena' => '$(esc "$DB_CONTRASENA")',"
              echo "    'basedatos' => '$(esc "$DB_NOMBRE")',"
              echo "];"
            } > api/config.php
            echo "api/config.php generado."
          fi

      - name: Copiar al hosting (solo lo que ha cambiado)
        run: |
          rsync -rlt --omit-dir-times --compress --chmod=D755,F644 \
            --exclude '.git' --exclude '.github' \
            --info=stats2 \
            ./ historiatotal@hl1708.dinaserver.com:www/

      - name: Vaciar el buzón de audios y vídeos (ya están en el hosting)
        run: |
          sha=$(cat /tmp/buzon.sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            vacio=$(git commit-tree $(git hash-object -t tree /dev/null) -m "Buzón vacío (todo publicado en el hosting)")
            git push -q --force-with-lease=refs/heads/buzon-medios:$sha origin $vacio:refs/heads/buzon-medios \
              || echo "::warning::El buzón ha recibido ficheros nuevos mientras se publicaba; se vaciará en la próxima publicación"
          fi

      - name: Comprobar que la web responde
        run: |
          for u in http://historiatotal.es/ https://historiatotal.es/ https://historiatotal.es/index.html https://historiatotal.es/audio/ant1-0-g.mp3 https://historiatotal.es/datos/; do
            r=$(curl -s -o /tmp/body -w "%{http_code} %{size_download}B %{content_type}" -m 30 "$u" || echo "sin conexion")
            t=$(grep -o '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | sed 's/<title>//')
            echo "::notice::$u -> $r $t"
          done
          h=$(curl -sI -m 30 https://historiatotal.es/index.html | grep -iE '^(cache-control|age|x-cache|x-varnish|via|server):' | tr -d '\r' | tr '\n' ' ')
          echo "::notice::Cabeceras: $h"

      - name: Comprobar la base de datos (api/sync.php)
        run: |
          set -x
          curl -sS -m 30 -X POST "https://historiatotal.es/api/sync.php?codigo=CIACTIONS" -H "Content-Type: application/json" -d '{"prueba":true}'
          echo
          curl -sS -m 30 "https://historiatotal.es/api/sync.php?codigo=CIACTIONS"
          echo
