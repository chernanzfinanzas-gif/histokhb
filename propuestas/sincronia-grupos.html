<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HistoKHB · Sincronía por grupos (propuesta)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ec;--ink:#2e2a40;--muted:#7d7790;--line:#ece4d6;--accent:#e08a3c;--yw:62px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
h1{font-family:Fredoka;font-size:20px;margin:0 0 6px}
.bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}
.bar button{flex:0 0 auto;font-family:Fredoka;font-weight:600;font-size:13.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .off{opacity:.45}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
#wrap{overflow:auto;height:calc(100vh - 150px);height:calc(100dvh - 150px)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;background:var(--bg)}
thead th{position:sticky;top:0;z-index:5;background:#f3ead9;font-family:Fredoka;font-weight:600;font-size:14px;padding:6px 6px 5px;text-align:left;white-space:nowrap}
thead th.g{cursor:pointer}
thead th .tg{font-size:11px;color:var(--muted);font-weight:500;display:block}
thead th .mv{float:right;margin-left:6px;font-size:13px;color:var(--muted);user-select:none}
thead th .mv span{padding:0 3px;cursor:pointer}
thead th.sub{background:#f8f1e4;font-size:13px}
th.y,td.y{position:sticky;left:0;z-index:4;width:var(--yw);min-width:var(--yw);background:#f3ead9;font-family:Fredoka;font-weight:600;font-size:12.5px;padding:6px 4px;text-align:right;color:#7a5a2a}
thead th.y{z-index:6}
td.c{width:250px;min-width:250px;max-width:250px;padding:4px 5px}
td.c.z{width:190px;min-width:190px;max-width:190px}
@media(min-width:1100px){td.c{width:auto;min-width:200px;max-width:none}}
.ev{display:block;font-size:13.5px;line-height:1.3;padding:4px 6px;margin:2px 0;border-radius:6px;border-left:5px solid;background:#fff;text-decoration:none;color:inherit}
.ev small{display:block;color:var(--muted);font-size:11px;font-family:Fredoka;font-weight:500}
.ev.det{box-shadow:inset 0 0 0 1px #e8d9bd}.ev.det::after{content:' ›';color:var(--accent);font-weight:700}
.ev.bio{font-weight:700}
.empty{height:6px}
</style></head><body>
<header>
 <h1>🌍 Sincronía <small style="font-family:Nunito;font-weight:600;font-size:12px;color:var(--muted)">· propuesta por grupos</small></h1>
 <div class="bar" id="eras"></div>
 <div class="bar" id="grs" style="margin-top:4px"></div>
 <p class="hint">Toca el nombre de un grupo para desplegarlo en zonas · ◀ ▶ para cambiar el orden · los botones de abajo muestran u ocultan grupos.</p>
</header>
<div id="wrap"><table id="t"></table></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fy=y=>y<0?(-y).toLocaleString('es-ES')+' a.C.':String(y);
const ESP='Hispania · Castilla · España', rn=r=>r===ESP?'Castilla · España':r;
const ESPS=['Portugal','Galicia','Asturias','León',ESP,'Navarra / P.Vasco-Rioja','Aragón / C.Valenciana','Cataluña','Al-Ándalus / Andalucía-Murcia'];
const APP='../index.html';
const ERAS=[['pre','Prehistoria',-1e7,-3501],['ant','Antigua',-3500,475],['med','Media',476,1491],['mod','Moderna',1492,1788],['con','Contemporánea',1789,2100],['tod','Todo',-1e7,2100]];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let S=null, G=[], ORD=LS.get('sg_ord',null), HID=new Set(LS.get('sg_hid',[])), OPEN=new Set(LS.get('sg_open',[])), ERA=LS.get('sg_era','ant');
function groups(){const R=S.regs;
 const g=[{id:'global',t:'Global',ic:'🌐',zones:R.filter(r=>r[1]==='global').map(r=>r[0]),cont:null},
  {id:'espana',t:'España',ic:'🇪🇸',zones:ESPS.filter(z=>S.ev[z]),cont:'España'},
  {id:'europa',t:'Europa',ic:'🏰',zones:R.filter(r=>r[1]==='europa'&&!ESPS.includes(r[0])).map(r=>r[0]),cont:'Europa'},
  {id:'asia',t:'Asia',ic:'🐉',zones:R.filter(r=>r[1]==='asia').map(r=>r[0]),cont:'Asia'},
  {id:'america',t:'América',ic:'🌽',zones:R.filter(r=>r[1]==='america').map(r=>r[0]),cont:'América'},
  {id:'africa',t:'África',ic:'🐘',zones:R.filter(r=>r[1]==='africa').map(r=>r[0]),cont:'África'},
  {id:'oceania',t:'Oceanía',ic:'🌊',zones:R.filter(r=>r[1]==='oceania').map(r=>r[0]),cont:'Oceanía'}];
 const o=ORD&&ORD.length===g.length?ORD:g.map(x=>x.id); return o.map(id=>g.find(x=>x.id===id)).filter(Boolean);}
function evAt(reg,y){return (S.ev[reg]||[]).filter(e=>e[0]===y);}
function evHtml(reg,e,showZone){const key=reg+'|'+e[0], det=!!e[3];
 const inner=`${showZone?`<small>${esc(rn(reg))}</small>`:''}${esc(e[1])}`;
 return det?`<a class="ev det${e[3]===2?' bio':''}" style="border-color:${e[2]}" href="${APP}#/s/${encodeURIComponent(key)}">${inner}</a>`:`<span class="ev" style="border-color:${e[2]}">${inner}</span>`;}
function render(){
 const [,,y0,y1]=ERAS.find(e=>e[0]===ERA);
 $('#eras').innerHTML=ERAS.map(([id,t])=>`<button class="${id===ERA?'on':''}" data-e="${id}">${t}</button>`).join('');
 $('#eras').querySelectorAll('button').forEach(b=>b.onclick=()=>{ERA=b.dataset.e;LS.set('sg_era',ERA);render();});
 G=groups();
 $('#grs').innerHTML=G.map(g=>`<button class="${HID.has(g.id)?'off':''}" data-g="${g.id}">${g.ic} ${g.t}</button>`).join('');
 $('#grs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.g;HID.has(id)?HID.delete(id):HID.add(id);LS.set('sg_hid',[...HID]);render();});
 const has=g=>[...(g.cont?[g.cont]:[]),...g.zones].some(r=>(S.ev[r]||[]).some(e=>e[0]>=y0&&e[0]<=y1));
 const vis=G.filter(g=>!HID.has(g.id)&&has(g));
 // columnas: grupo plegado = 1 columna (todas sus zonas + su fila continental); desplegado = 1 columna por zona (+ continental si hay)
 const cols=[]; vis.forEach(g=>{const all=[...(g.cont&&S.ev[g.cont]?[g.cont]:[]),...g.zones];
  if(OPEN.has(g.id)) all.forEach(z=>cols.push({g,regs:[z],zone:z})); else cols.push({g,regs:all,zone:null});});
 const years=new Set(); cols.forEach(c=>c.regs.forEach(r=>(S.ev[r]||[]).forEach(e=>{if(e[0]>=y0&&e[0]<=y1)years.add(e[0]);})));
 const Y=[...years].sort((a,b)=>a-b);
 let h='<thead><tr><th class="y" rowspan="2">Año</th>';
 vis.forEach((g,i)=>{const n=cols.filter(c=>c.g===g).length;
  h+=`<th class="g" colspan="${n}" data-g="${g.id}"><span class="mv"><span data-m="-1">◀</span><span data-m="1">▶</span></span>${g.ic} ${g.t} <span class="tg">${OPEN.has(g.id)?'▾ plegar':'▸ '+g.zones.length+' zonas'}</span></th>`;});
 h+='</tr><tr>'+cols.map(c=>`<th class="sub">${c.zone?esc(c.zone===c.g.cont?'Todo '+c.g.t:rn(c.zone)):'Todas sus zonas'}</th>`).join('')+'</tr></thead><tbody>';
 Y.forEach(y=>{h+=`<tr><td class="y">${fy(y)}</td>`;
  cols.forEach(c=>{const items=[];c.regs.forEach(r=>evAt(r,y).forEach(e=>items.push(evHtml(r,e,!c.zone&&r!==c.g.cont))));
   h+=`<td class="c${c.zone?' z':''}">${items.join('')||'<div class="empty"></div>'}</td>`;});
  h+='</tr>';});
 h+='</tbody>'; $('#t').innerHTML=h;
 $('#t').querySelectorAll('th.g').forEach(th=>th.onclick=ev=>{const id=th.dataset.g, m=ev.target.dataset.m;
  if(m){const o=G.map(g=>g.id), i=o.indexOf(id), j=i+(+m); if(j<0||j>=o.length)return; [o[i],o[j]]=[o[j],o[i]]; ORD=o; LS.set('sg_ord',o); render(); return;}
  OPEN.has(id)?OPEN.delete(id):OPEN.add(id); LS.set('sg_open',[...OPEN]); render();});
}
fetch('../datos/sinc-eventos.json').then(r=>r.json()).then(j=>{S=j;render();});
</script>
</body></html>
